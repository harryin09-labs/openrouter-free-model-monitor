name: OpenRouter Free Models Monitor
on:
  schedule:
    # Primary 08:59 IST; backup 09:29 IST
    - cron: '29 3 * * *'
    - cron: '59 3 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: Send a Telegram report even with no changes
        required: true
        default: true
        type: boolean
      weekly_summary:
        description: Send weekly summary now
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: openrouter-free-model-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_TIMEZONE: Asia/Kolkata
      ENABLE_WEEKLY_SUMMARY: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check scheduled delivery receipt
        id: receipt
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: python scripts/schedule_guard.py check
      - name: Unit tests
        if: steps.receipt.outputs.run_monitor == 'true'
        run: python -m unittest discover -s tests -v
      - name: Monitor OpenRouter free models
        if: steps.receipt.outputs.run_monitor == 'true'
        env:
          FORCE_NOTIFY: ${{ github.event_name == 'schedule' || inputs.force_notify }}
          WEEKLY_SUMMARY: ${{ inputs.weekly_summary }}
        run: |
          ARGS=()
          if [[ "$FORCE_NOTIFY" == "true" ]]; then ARGS+=(--force-notify); fi
          if [[ "$WEEKLY_SUMMARY" == "true" ]]; then ARGS+=(--weekly yes); fi
          python scripts/monitor.py "${ARGS[@]}"
      - name: Record scheduled successful delivery
        if: steps.receipt.outputs.run_monitor == 'true' && github.event_name == 'schedule'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: python scripts/schedule_guard.py mark
      - name: Commit snapshot, history and delivery receipt
        if: steps.receipt.outputs.run_monitor == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Update free model snapshot and delivery state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Snapshot and delivery state pushed successfully"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflicting remote updates; refusing force push or overwrite"
              exit 1
            fi
            sleep "$attempt"
          done
          echo "::error::Push failed after three attempts"
          exit 1
