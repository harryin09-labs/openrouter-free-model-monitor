name: OpenRouter Free Models Monitor
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: Send a Telegram report even with no changes
        required: true
        default: true
        type: boolean
      weekly_summary:
        description: Send weekly summary now
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: openrouter-free-model-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_TIMEZONE: Asia/Kolkata
      ENABLE_WEEKLY_SUMMARY: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Monitor OpenRouter free models
        env:
          FORCE_NOTIFY: ${{ github.event_name == 'schedule' || inputs.force_notify }}
          WEEKLY_SUMMARY: ${{ inputs.weekly_summary }}
        run: |
          ARGS=()
          if [[ "$FORCE_NOTIFY" == "true" ]]; then ARGS+=(--force-notify); fi
          if [[ "$WEEKLY_SUMMARY" == "true" ]]; then ARGS+=(--weekly yes); fi
          python scripts/monitor.py "${ARGS[@]}"
      - name: Commit snapshot and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update OpenRouter free model snapshot"
            git push
          fi
